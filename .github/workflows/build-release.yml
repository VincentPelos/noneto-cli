name: Build release candidate

on:
  workflow_dispatch:
    inputs:
      sign:
        description: Request signing (requires approved SignPath configuration)
        type: boolean
        default: false

permissions: {}

jobs:
  windows:
    if: github.repository == 'VincentPelos/noneto-cli' && github.ref == 'refs/heads/main'
    runs-on: windows-2025
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Read pinned toolchain
        id: tools
        shell: pwsh
        run: |
          $tools = Get-Content packaging/toolchain.json -Raw | ConvertFrom-Json
          "python=$($tools.python)" >> $env:GITHUB_OUTPUT
          "uv=$($tools.uv)" >> $env:GITHUB_OUTPUT
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: ${{ steps.tools.outputs.uv }}
          enable-cache: false
      - name: Prepare the pinned Python runtime
        shell: pwsh
        env:
          PYTHON_VERSION: ${{ steps.tools.outputs.python }}
        run: |
          uv python install $env:PYTHON_VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = uv python find --managed-python $env:PYTHON_VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Split-Path -Parent $python) >> $env:GITHUB_PATH
      - name: Validate release configuration
        id: release
        shell: pwsh
        env:
          REQUEST_SIGNING: ${{ inputs.sign }}
          SIGNING_ENABLED: ${{ vars.SIGNPATH_ENABLED }}
          SIGNING_ORG: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        run: |
          if ($env:REQUEST_SIGNING -eq 'true' -and ($env:SIGNING_ENABLED -ne 'true' -or -not $env:SIGNING_ORG)) {
            throw 'SignPath is not enabled/configured. Build unsigned until approval is complete.'
          }
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          "version=$version" >> $env:GITHUB_OUTPUT
          python -m unittest discover -s tests -p test_release.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build packages and application
        shell: pwsh
        run: |
          python packaging/release.py packages --work build/release --output dist/candidate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python packaging/release.py bundle --work build/release --output dist/candidate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record unsigned application artifact
        if: inputs.sign
        id: app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: noneto-app-unsigned
          path: build/release/dist/noneto/noneto.exe
          if-no-files-found: error
      - name: Request application signature
        if: inputs.sign
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: noneto-cli
          signing-policy-slug: release-signing
          artifact-configuration-slug: noneto-app
          github-artifact-id: ${{ steps.app.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: build/signed-app
          parameters: |
            version: ${{ steps.release.outputs.version }}
      - name: Use the signed application
        if: inputs.sign
        shell: pwsh
        run: |
          python packaging/release.py verify-signature --file build/signed-app/noneto.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -LiteralPath build/signed-app/noneto.exe -Destination build/release/dist/noneto/noneto.exe
      - name: Build installer from the same application
        shell: pwsh
        env:
          REQUEST_SIGNING: ${{ inputs.sign }}
        run: |
          $signing = @()
          if ($env:REQUEST_SIGNING -eq 'true') { $signing += '--require-signed' }
          python packaging/release.py installer --work build/release --output dist/candidate @signing
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record unsigned installer artifact
        if: inputs.sign
        id: installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: noneto-installer-unsigned
          path: dist/candidate/*-windows-x64-setup.exe
          if-no-files-found: error
      - name: Request installer signature
        if: inputs.sign
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: noneto-cli
          signing-policy-slug: release-signing
          artifact-configuration-slug: noneto-installer
          github-artifact-id: ${{ steps.installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: build/signed-installer
          parameters: |
            version: ${{ steps.release.outputs.version }}
      - name: Verify final signature and compute checksums
        shell: pwsh
        env:
          REQUEST_SIGNING: ${{ inputs.sign }}
        run: |
          $signing = @()
          if ($env:REQUEST_SIGNING -eq 'true') {
            Copy-Item -Path build/signed-installer/*-windows-x64-setup.exe -Destination dist/candidate
            $signing += '--require-signed'
          }
          python packaging/release.py manifest --work build/release --output dist/candidate @signing
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload candidate and provenance manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: noneto-release-candidate-${{ steps.release.outputs.version }}
          path: dist/candidate/
          if-no-files-found: error
          retention-days: 30
